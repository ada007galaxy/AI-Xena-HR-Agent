services:
  - type: web
    name: xena-hr-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python ingest.py
    startCommand: bash start_render.sh
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: RETRIEVAL_K
        value: "4"
